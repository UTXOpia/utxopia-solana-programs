[package]
name = "utxopia-policy"
version = "0.1.0"
edition = "2021"
description = "Minimal MagicBlock PER policy coprocessor for UTXOpia"

[lib]
crate-type = ["cdylib", "lib"]
name = "utxopia_policy"

[dependencies]
pinocchio = { version = "0.10", features = ["cpi"] }
pinocchio-system = "0.5"
solana-address = { version = "2.7", features = ["curve25519"] }
ephemeral-rollups-pinocchio = "0.16.2"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(target_os, values(\"solana\"))"] }
