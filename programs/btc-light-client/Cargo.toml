[package]
name = "btc-light-client"
version = "0.1.0"
description = "Bitcoin light client for SPV verification on Solana (Pinocchio)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "btc_light_client"

[features]
default = []
# Production build: compiles out the `reinitialize` admin instruction, which can otherwise
# rewrite the chain head. MUST be set for mainnet deployments.
mainnet = []
# Network assertions. These gate nothing on their own — they exist so an on-chain build is
# forced to state which network it is for (see the compile_error in lib.rs), which is what
# stops a bare `cargo build-sbf` artifact from reaching mainnet with `reinitialize` live.
devnet = []
localnet = []
devnet-regtest = ["devnet"]

[dependencies]
pinocchio = "0.9"
pinocchio-system = "0.3"

[dev-dependencies]
# Real SHA-256 for host tests so assertions exercise genuine digests (audit f01).
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(target_os, values(\"solana\"))"] }
